[package]
name = "adventurepad-sdk"
description = "Write panels for Adventure Pad's extra screen: read the running game's memory, draw with egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Panels draw with exactly the app's egui (re-exported as adventurepad_sdk::egui).
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
