[package]
name = "adventurepad"
description = "Adventure Pad: a Game Boy, Game Boy Color and GBA player with live companion panels beside the game"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "AdventurePad"
path = "src/main.rs"

[dependencies]
mgba-sys = { path = "../mgba-sys" }
adventurepad-sdk = { path = "../sdk" }
panels-pokemon = { path = "../panels-pokemon" }
panels-tools = { path = "../panels-tools" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
cpal = "0.15"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.17"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
